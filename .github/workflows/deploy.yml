name: Deploy\n\non:\n  push:\n    branches: ["main"]\n\njobs:\n  publish:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@v3\n\n      - name: Set up Docker Buildx\n        uses: docker/setup-buildx-action@v2\n\n      - name: Log in to Docker registry\n        uses: docker/login-action@v2\n        with:\n          registry: docker.io\n          username: ${{ secrets.DOCKER_REGISTRY_USER }}\n          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}\n\n      - name: Build and push backend image\n        run: |\n          docker build -t myorg/backend:latest ./backend\n          docker push myorg/backend:latest\n\n      - name: Build and push frontend image\n        run: |\n          docker build -t myorg/frontend:latest ./frontend\n          docker push myorg/frontend:latest\n\n      - name: Trigger deployment script (placeholder)\n        run: echo "Deploy step would be triggered here"\n