name: CI\n\non:\n  push:\n    branches: ["*"]\n\njobs:\n  build-and-test:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@v3\n\n      - name: Set up Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: "20"\n\n      - name: Set up Python\n        uses: actions/setup-python@v4\n        with:\n          python-version: "3.11"\n\n      - name: Build Docker images\n        run: |\n          docker build -t myorg/backend:ci ./backend\n          docker build -t myorg/frontend:ci ./frontend\n\n      - name: Lint backend (flake8)\n        run: |\n          pip install flake8\n          flake8 backend/app\n\n      - name: Lint frontend (eslint)\n        run: |\n          cd frontend\n          npm ci\n          npx eslint "src/**/*.tsx"\n\n      - name: Run backend tests\n        run: |\n          pip install -r backend/requirements.txt\n          pytest -q backend/tests\n\n      - name: Run frontend tests\n        run: |\n          cd frontend\n          npm test --silent\n