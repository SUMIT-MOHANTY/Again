_format_version: "3.0"
_transform: true

services:
- name: banking-service
  url: http://host.docker.internal:5000
  routes:
  - name: banking-route
    paths:
    - /api/v1/banking
    - /api/v1/accounts
    - /api/v1/transfers
    - /api/v1/loans
    strip_path: false

plugins:
- name: rate-limiting
  config:
    minute: 100
    policy: local
- name: cors
  config:
    origins:
    - "*"
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    headers:
    - Accept
    - Accept-Version
    - Content-Length
    - Content-MD5
    - Content-Type
    - Date
    - Authorization
    exposed_headers:
    - X-Auth-Token
    credentials: true
    max_age: 3600
