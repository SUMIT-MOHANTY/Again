version: "3.9"\nservices:\n  postgres:\n    image: postgres:15\n    env_file: .env.example\n    environment:\n      POSTGRES_USER: ${POSTGRES_USER}\n      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}\n      POSTGRES_DB: ${POSTGRES_DB}\n    volumes:\n      - pg_data:/var/lib/postgresql/data\n    ports:\n      - "5432:5432"\n\n  redis:\n    image: redis:7\n    ports:\n      - "6379:6379"\n\n  backend:\n    build: ./backend\n    image: myorg/backend:latest\n    env_file: .env.example\n    depends_on:\n      - postgres\n      - redis\n    ports:\n      - "8000:8000"\n\n  frontend:\n    build: ./frontend\n    image: myorg/frontend:latest\n    depends_on:\n      - backend\n    ports:\n      - "5173:80"\n\nvolumes:\n  pg_data:\n