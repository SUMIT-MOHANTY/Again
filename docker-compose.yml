version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    env_file:
      - .env.example
    depends_on:
      - db
    ports:
      - "5000:5000"
    volumes:
      - ./backups:/backups
  frontend:
    image: node:20-alpine
    working_dir: /frontend
    command: sh -c "npm install && npm start"
    volumes:
      - ./frontend:/frontend
    ports:
      - "3000:3000"
volumes:
  pgdata:
