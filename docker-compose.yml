version: '3.8'
services:
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      - db
      - redis
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: library
  redis:
    image: redis:7
    ports:
      - "6379:6379"
